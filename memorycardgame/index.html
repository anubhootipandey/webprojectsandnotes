<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
            font-family: 'Arial', sans-serif;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
        }

        .card {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .card.matched {
            background-color: #2ecc71;
            cursor: default;
        }
    </style>
</head>
<body>

<div id="game-board"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const symbols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        const cards = [...symbols, ...symbols]; // Duplicate symbols to create pairs
        let flippedCards = [];
        let matchedCards = [];

        // Shuffle the cards
        cards.sort(() => Math.random() - 0.5);

        const gameBoard = document.getElementById('game-board');

        // Create the card elements on the game board
        cards.forEach(symbol => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.symbol = symbol;
            cardElement.textContent = symbol;
            cardElement.addEventListener('click', flipCard);
            gameBoard.appendChild(cardElement);
        });

        // Function to handle card flipping
        function flipCard() {
            if (flippedCards.length === 2) {
                return; // Allow only two flipped cards at a time
            }

            const card = this;

            if (card.classList.contains('matched') || card.classList.contains('flipped')) {
                return; // Ignore matched or already flipped cards
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                setTimeout(checkMatch, 500); // Check for a match after a short delay
            }
        }

        // Function to check if the flipped cards form a match
        function checkMatch() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.symbol === card2.dataset.symbol) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCards.push(card1, card2);
                checkWin();
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
            }

            flippedCards = []; // Reset flipped cards
        }

        // Function to check if the player has won
        function checkWin() {
            if (matchedCards.length === cards.length) {
                alert('Congratulations! You have won!');
            }
        }
    });
</script>

</body>
</html>
